name: CodSpeed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets CodSpeed trigger backtest runs to build initial history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build benchmarks
      run: |
        cmake -S benchmarks -B build/benchmarks -DCODSPEED_MODE=simulation -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build/benchmarks -j "$(nproc)"
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v5
      with:
        mode: simulation
        run: ./build/benchmarks/memftprt_bench
