name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make
    - name: Test with a delegated cgroup v2
      shell: bash
      run: |
        set -euo pipefail
        cgroup_root=/sys/fs/cgroup
        current_relative="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
        current_cgroup="${cgroup_root}${current_relative}"
        delegate="${current_cgroup}/memftprt-ci-delegate"
        target="${delegate}/target"

        cleanup() {
          sudo sh -c "echo $$ > '$current_cgroup/cgroup.procs'" || true
          sudo rmdir "$target" "$delegate" || true
        }
        trap cleanup EXIT

        sudo mkdir -p "$target"
        sudo chown "$(id -u):$(id -g)" \
          "$delegate/cgroup.procs" \
          "$target/cgroup.procs" \
          "$target/cgroup.freeze"
        sudo sh -c "echo $$ > '$delegate/cgroup.procs'"

        MEMFTPRT_TEST_CGROUP="$target" \
        MEMFTPRT_REQUIRE_CGROUP_TEST=1 \
          make test
