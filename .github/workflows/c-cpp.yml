name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make
    - name: Prepare delegated cgroup v2
      run: |
        sudo mkdir -p /sys/fs/cgroup/memftprt-ci
        sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/memftprt-ci
        sudo chown "$(id -u):$(id -g)" \
          /sys/fs/cgroup/memftprt-ci/cgroup.procs \
          /sys/fs/cgroup/memftprt-ci/cgroup.freeze
    - name: Test
      env:
        MEMFTPRT_TEST_CGROUP: /sys/fs/cgroup/memftprt-ci
        MEMFTPRT_REQUIRE_CGROUP_TEST: "1"
      run: make test
    - name: Clean up delegated cgroup
      if: always()
      run: sudo rmdir /sys/fs/cgroup/memftprt-ci || true
